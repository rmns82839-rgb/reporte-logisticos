<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0D16">
<title>Reporte Logísticos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<div class="app">

  <header class="topbar">
    <div class="topbar-brand">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2c-.3 3-4 6.4-4 10.2A4 4 0 0 0 12 16a4 4 0 0 0 4-3.8C16 8.4 12.3 5 12 2z"/></svg>
      </div>
      <div class="topbar-title">
        <span class="topbar-eyebrow">Recepción de muestras</span>
        <h1>Reporte Logísticos</h1>
      </div>
    </div>
    <button id="resetBtn" class="icon-btn" title="Nuevo reporte" aria-label="Nuevo reporte">
      <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 5V2L7 6l5 4V7c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8 8 8 0 0 0 8-8 8 8 0 0 0-8-8z"/></svg>
    </button>
  </header>

  <div id="statsStrip" class="stats-strip"></div>

  <main>

    <div class="col col-left">
      <!-- Auxiliar -->
      <section class="card">
        <h2 class="card-title">¿A quién le está recibiendo?</h2>
        <div id="auxGrid" class="aux-grid"></div>
      </section>

      <!-- Horas -->
      <section class="card">
        <div class="card-head-row">
          <h2 class="card-title">Horas recibidas</h2>
          <div class="legend">
            <span class="legend-item"><i class="dot dot-vip"></i>VIP</span>
            <span class="legend-item"><i class="dot dot-fsfb"></i>FSFB</span>
            <span class="legend-item"><i class="dot dot-poliza"></i>Poliza</span>
          </div>
        </div>
        <p class="card-hint">Marca el check de las horas que sí llegaron. El desplegable ya viene en VIP — solo cámbialo si fue FSFB o Poliza.</p>
        <div id="hourGrid" class="hour-list"></div>

        <div id="extraList" class="extra-list"></div>
        <button id="addExtraBtn" class="ghost-btn" type="button">+ Agregar hora extraordinaria</button>
      </section>
    </div>

    <div class="col col-right">
      <!-- Tubos -->
      <section class="card">
        <h2 class="card-title">Tubos y muestras recibidas</h2>
        <div id="tubeList" class="tube-list"></div>
      </section>

      <!-- Resumen -->
      <section class="card summary-card">
        <div class="summary-head">
          <h2 class="card-title">Vista previa del reporte</h2>
          <span class="summary-tag">WhatsApp</span>
        </div>
        <pre id="preview" class="preview"></pre>
      </section>
    </div>

  </main>

  <footer class="action-bar">
    <button id="copyBtn" class="btn btn-secondary" type="button">
      <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
      Copiar
    </button>
    <button id="sendBtn" class="btn btn-primary" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.1a8 8 0 0 1-4.3-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.1 8.1 0 1 1 12 20.1zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.7.9-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.2.1-.1 0-.3 0-.4L9.5 8.2c-.2-.4-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2c0 1.3.9 2.6 1.1 2.8s1.7 2.6 4.1 3.6c2.4 1 2.4.7 2.9.6a2.4 2.4 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c-.1-.1-.2-.2-.4-.3z"/></svg>
      Enviar por WhatsApp
    </button>
  </footer>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
